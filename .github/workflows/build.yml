name: build-musl

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-musl-full:latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Install build dependencies (Void musl)
        run: |
          xbps-install -S
          xbps-install -y bash git cmake ninja gcc pkg-config make file linux-headers \
            qt6-base-devel qt6-svg-devel qt6-declarative-devel \
            libcurl-devel libpng-devel MesaLib-devel libgbm-devel libevdev-devel eudev-libudev-devel \
            openssl-devel zlib-devel libzstd-devel libzip-devel libX11-devel libxcb-devel

      - name: Checkout (recursive, shell)
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory '*'
          git config --global url."https://SrDicov:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git clone --recursive https://github.com/SrDicov/trinity-launcher-build.git repo
          cd repo
          git checkout "${GITHUB_SHA}"
          git submodule update --init --recursive

      - name: Patch musl headers (__unused clash with bionic)
        shell: bash
        run: |
          for f in /usr/include/bits/stat.h /usr/include/bits/statvfs.h; do
            if [ -f "$f" ] && grep -q '__unused' "$f"; then
              sed -i 's/__unused/__musl_unused/g' "$f"
            fi
          done

      - name: Configure & Build (extract + client + trinity)
        shell: bash
        run: |
          cd repo
          COMPAT="$(pwd)/musl-compat.h"
          CXXFLAGS="-O3 -msse3 -flto -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -D_LARGEFILE64_SOURCE -D_GNU_SOURCE -include $COMPAT -Wno-error -fpermissive"
          CFLAGS="-O3 -msse3 -flto -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -D_LARGEFILE64_SOURCE -D_GNU_SOURCE -include $COMPAT"
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_FLAGS="$CFLAGS" -DCMAKE_CXX_FLAGS="$CXXFLAGS" \
            -DBUILD_CLIENT=ON -DBUILD_UI=ON -DBUILD_X86=OFF \
            -DUSE_OWN_CURL=OFF -DXAL_WEBVIEW_USE_QT=OFF -DXAL_WEBVIEW_USE_CLI=ON -DUSE_SDL3_AUDIO=ON
          cmake --build build -j"$(nproc)"

      - name: Publish to release 20260829
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd repo
          mkdir -p dist
          find build -type f -name mcpelauncher-extract -exec cp {} dist/ \;
          find build -type f -name trinity -exec cp {} dist/ \;
          find build -type f -name mcpelauncher-client -exec cp {} dist/ \;
          ls -la dist
          RELID=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/SrDicov/trinity-launcher-build/releases/tags/20260829" | grep -oE '"id": [0-9]+' | head -1 | grep -oE '[0-9]+')
          echo "release id=$RELID"
          for name in mcpelauncher-extract mcpelauncher-client trinity; do
            AID=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/SrDicov/trinity-launcher-build/releases/$RELID/assets" | python3 -c "import json,sys;d=json.load(sys.stdin);print([a['id'] for a in d if a['name']=='$name'])" )
            if [ -n "$AID" ] && [ "$AID" != "[]" ]; then
              curl -s -X DELETE -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/SrDicov/trinity-launcher-build/releases/assets/$AID"
            fi
          done
          for b in mcpelauncher-extract mcpelauncher-client trinity; do
            curl -s -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary @"dist/$b" "https://uploads.github.com/repos/SrDicov/trinity-launcher-build/releases/$RELID/assets?name=$b" \
              | grep -oE '"name": "[^"]+"' | head -1
          done
          echo "PUBLISHED https://github.com/SrDicov/trinity-launcher-build/releases/tag/20260829"

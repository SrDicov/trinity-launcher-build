name: build-musl

on:
  push:
    branches: [main, musl]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: alpine:latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Install build dependencies (musl)
        run: |
          apk add --no-cache build-base cmake ninja clang git bash nodejs file \
            sqlite-dev openssl-dev curl-dev pulseaudio-dev mesa-dev \
            libx11-dev libxkbcommon-dev wayland-dev libxi-dev libpng-dev \
            libzip-dev qt6-qtbase-dev qt6-qttools-dev libunwind-dev

      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (shallow, recursive)
        run: |
          git config --global --add safe.directory '*'
          git submodule update --init --recursive --depth 1

      - name: Build mcpelauncher-extract
        run: |
          mkdir -p /tmp/artifacts
          cmake -S vendor/mcpelauncher-extract -B /tmp/b-extract \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="-O3 -msse3 -flto" \
            -DCMAKE_EXE_LINKER_FLAGS="-flto"
          cmake --build /tmp/b-extract -j"$(nproc)"
          cp /tmp/b-extract/mcpelauncher-extract /tmp/artifacts/ || true

      - name: Build mcpelauncher-client (native musl)
        run: |
          cmake -S vendor/mcpelauncher-manifest -B /tmp/b-manifest \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="-O3 -msse3 -flto" \
            -DCMAKE_EXE_LINKER_FLAGS="-flto" \
            -DBUILD_CLIENT=ON -DBUILD_UI=OFF -DBUILD_X86=OFF \
            -DUSE_OWN_CURL=OFF -DXAL_WEBVIEW_USE_QT=OFF -DXAL_WEBVIEW_USE_CLI=ON \
            -DUSE_SDL3_AUDIO=ON
          cmake --build /tmp/b-manifest -j"$(nproc)" --target mcpelauncher-client
          find /tmp/b-manifest -type f -name mcpelauncher-client -exec cp {} /tmp/artifacts/ \;

      - name: Build Trinity Launcher (native musl)
        run: |
          cmake -S . -B /tmp/b-trinity \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="-O3 -msse3 -flto" \
            -DCMAKE_C_FLAGS="-O3 -msse3 -flto" \
            -DCMAKE_EXE_LINKER_FLAGS="-flto"
          cmake --build /tmp/b-trinity -j"$(nproc)"
          find /tmp/b-trinity -type f -name trinity -exec cp {} /tmp/artifacts/ \;

      - name: Inspect artifacts
        run: |
          ls -la /tmp/artifacts/
          file /tmp/artifacts/* 2>/dev/null || true

      - name: Upload musl binaries
        uses: actions/upload-artifact@v4
        with:
          name: trinity-musl-binaries
          path: /tmp/artifacts/

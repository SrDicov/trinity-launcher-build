name: build-musl

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-musl-full:latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Install build dependencies (Void musl)
        run: |
          xbps-install -S
          xbps-install -y bash git cmake ninja gcc curl python3 pkg-config make file linux-headers \
            qt6-base-devel qt6-svg-devel qt6-declarative-devel qt6-tools qt6-tools-devel \
            libcurl-devel libpng-devel MesaLib-devel libgbm-devel libevdev-devel eudev-libudev-devel \
            openssl-devel zlib-devel libzstd-devel libzip-devel libX11-devel libxcb-devel \
            wayland-devel wayland-protocols libxkbcommon-devel

      - name: Checkout (recursive, shell)
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory '*'
          git config --global url."https://SrDicov:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git clone --recursive https://github.com/SrDicov/trinity-launcher-build.git repo
          cd repo
          git checkout "${GITHUB_SHA}"
          git submodule update --init --recursive

      - name: Patch musl headers (__unused clash + sys/cdefs.h shim)
        shell: bash
        run: |
          for f in /usr/include/bits/stat.h /usr/include/bits/statvfs.h; do
            if [ -f "$f" ] && grep -q '__unused' "$f"; then
              sed -i 's/__unused/__musl_unused/g' "$f"
            fi
          done
          # musl has no glibc <sys/cdefs.h>; bionic's wrapper does #include_next <sys/cdefs.h>
          mkdir -p /usr/include/sys
          cp repo/musl-shim/sys/cdefs.h /usr/include/sys/cdefs.h
          echo "installed sys/cdefs.h shim"

      - name: Configure & Build (extract + client + trinity)
        shell: bash
        run: |
          cd repo
          COMPAT="$(pwd)/musl-compat.h"
          CXXFLAGS="-O3 -msse3 -flto -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -D_LARGEFILE64_SOURCE -D_GNU_SOURCE -include $COMPAT -Wno-error -fpermissive"
          CFLAGS="-O3 -msse3 -flto -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -D_LARGEFILE64_SOURCE -D_GNU_SOURCE -include $COMPAT"
          # 1) mcpelauncher-extract
          cmake -B vendor/mcpelauncher-extract/build -S vendor/mcpelauncher-extract \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_FLAGS="$CFLAGS" -DCMAKE_CXX_FLAGS="$CXXFLAGS"
          cmake --build vendor/mcpelauncher-extract/build -j"$(nproc)"
          # 2) mcpelauncher-client (bionic loader from manifest)
          cmake -B vendor/mcpelauncher-manifest/build -S vendor/mcpelauncher-manifest \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_FLAGS="$CFLAGS" -DCMAKE_CXX_FLAGS="$CXXFLAGS" \
            -DBUILD_CLIENT=ON -DBUILD_UI=OFF -DBUILD_X86=OFF \
            -DUSE_OWN_CURL=OFF -DXAL_WEBVIEW_USE_QT=OFF -DXAL_WEBVIEW_USE_CLI=ON -DUSE_SDL3_AUDIO=ON \
            -DGAMEWINDOW_SYSTEM=SDL3 -DSDL_WAYLAND=ON
          cmake --build vendor/mcpelauncher-manifest/build -j"$(nproc)"
          # 3) trinity (Qt6 frontend)
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_FLAGS="$CFLAGS" -DCMAKE_CXX_FLAGS="$CXXFLAGS"
          cmake --build build -j"$(nproc)"

      - name: Publish to release 20260829
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd repo
          mkdir -p dist
          # locate + copy each binary (first match only, no head pipes)
          for b in mcpelauncher-extract mcpelauncher-client trinity; do
            f=$(find vendor/mcpelauncher-extract/build vendor/mcpelauncher-manifest/build build -type f -name "$b" 2>/dev/null)
            f=${f%%$'\n'*}
            if [ -n "$f" ] && [ -f "$f" ]; then cp -v "$f" "dist/$b"; else echo "WARNING: $b missing"; fi
          done
          ls -la dist
          AUTH="Authorization: Bearer $TOKEN"
          RELJSON=$(curl -s -H "$AUTH" "https://api.github.com/repos/SrDicov/trinity-launcher-build/releases/tags/20260829")
          RELID=$(echo "$RELJSON" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('id',''))")
          echo "release id=$RELID"
          ASSETS=$(curl -s -H "$AUTH" "https://api.github.com/repos/SrDicov/trinity-launcher-build/releases/$RELID/assets")
          for name in mcpelauncher-extract mcpelauncher-client trinity; do
            AID=$(echo "$ASSETS" | python3 -c "import json,sys;d=json.load(sys.stdin);ids=[a['id'] for a in d if a['name']=='$name'];print(ids[0] if ids else '')" 2>/dev/null)
            if [ -n "$AID" ]; then
              curl -s -X DELETE -H "$AUTH" "https://api.github.com/repos/SrDicov/trinity-launcher-build/releases/assets/$AID" >/dev/null
            fi
          done
          for b in mcpelauncher-extract mcpelauncher-client trinity; do
            if [ -f "dist/$b" ]; then
              curl -s -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
                --data-binary @"dist/$b" "https://uploads.github.com/repos/SrDicov/trinity-launcher-build/releases/$RELID/assets?name=$b" >/dev/null
              echo "uploaded $b"
            else
              echo "WARNING: dist/$b missing"
            fi
          done
          echo "PUBLISHED https://github.com/SrDicov/trinity-launcher-build/releases/tag/20260829"

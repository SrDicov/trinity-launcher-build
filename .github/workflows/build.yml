name: build-musl

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-musl-full:latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Install build dependencies (Void musl)
        run: |
          xbps-install -S
          xbps-install -y bash git cmake ninja gcc g++ pkg-config make file linux-headers \
            qt6-base-devel qt6-svg-devel qt6-declarative-devel \
            libcurl-devel libpng-devel MesaLib-devel libgbm-devel libevdev-devel eudev-libudev-devel \
            openssl-devel zlib-devel libzstd-devel libzip-devel libX11-devel libxcb-devel

      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch musl headers (__unused clash with bionic)
        shell: bash
        run: |
          for f in /usr/include/bits/stat.h /usr/include/bits/statvfs.h; do
            if [ -f "$f" ] && grep -q '__unused' "$f"; then
              sed -i 's/__unused/__musl_unused/g' "$f"
            fi
          done

      - name: Configure & Build (extract + client + trinity)
        shell: bash
        env:
          CXXFLAGS: "-O3 -msse3 -flto -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -D_LARGEFILE64_SOURCE -D_GNU_SOURCE -include ${PWD}/musl-compat.h -Wno-error -fpermissive"
          CFLAGS: "-O3 -msse3 -flto -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -D_LARGEFILE64_SOURCE -D_GNU_SOURCE -include ${PWD}/musl-compat.h"
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_FLAGS="$CFLAGS" -DCMAKE_CXX_FLAGS="$CXXFLAGS" \
            -DBUILD_CLIENT=ON -DBUILD_UI=ON -DBUILD_X86=OFF \
            -DUSE_OWN_CURL=OFF -DXAL_WEBVIEW_USE_QT=OFF -DXAL_WEBVIEW_USE_CLI=ON -DUSE_SDL3_AUDIO=ON
          cmake --build build -j"$(nproc)"

      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p dist
          find build -type f -name mcpelauncher-extract -exec cp -v {} dist/ \;
          find build -type f -name trinity -exec cp -v {} dist/ \;
          find build -type f -name mcpelauncher-client -exec cp -v {} dist/ \;
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trinity-musl
          path: dist/
